spring:
  application:
    name: iot-gateway-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jooq:
    sql-dialect: postgres
  # OAuth2 Resource Server — JWT validation against Keycloak.
  # D.18.k rule: BOTH issuer-uri AND jwk-set-uri are required. issuer-uri does NOT
  # auto-derive jwk-set-uri. Both are sourced from K8s Secret iot-gateway-creds
  # via deployment envFrom/valueFrom: secretKeyRef (D.18.bb compliant).
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

server:
  port: 8080

# Traccar polling config (env-driven, no defaults)
traccar:
  base-url: ${TRACCAR_BASE_URL:http://localhost:8082}
  api-key: ${TRACCAR_API_KEY:}
  poll-interval-ms: ${TRACCAR_POLL_INTERVAL_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.fms.iotgateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
